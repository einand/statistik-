<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fördjupad statistik</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#e2edf2;background:#102532}*{box-sizing:border-box}body{margin:0;padding:14px;max-width:100%;overflow-x:hidden}h1{font-size:1rem;margin:0 0 10px}p,summary{font-size:.82rem;line-height:1.55}label{font-size:.78rem;display:block;min-width:0}select,button,input{font:inherit;background:#183745;color:inherit;border:1px solid #597a86;border-radius:7px;min-height:44px;padding:8px;width:100%;max-width:100%}select{white-space:normal;text-overflow:ellipsis}button{cursor:pointer;width:auto}#filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:10px 0}.span{grid-column:1/-1}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:.79rem}th,td{text-align:left;vertical-align:top;padding:8px;border-bottom:1px solid #355463;overflow-wrap:anywhere}th:first-child{width:45%}.rows{max-height:350px;overflow:auto}#notes{white-space:pre-line;overflow-wrap:anywhere}a{color:#92e4c5}#scope{padding:9px;background:#204a4c;border-radius:7px}#status{color:#b9d3d8}.actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:12px}#summary{background:#1a4146;padding:10px;border-radius:8px}@media(max-width:420px){#filters{grid-template-columns:1fr}th,td{padding:6px}}</style><link rel="stylesheet" href="/assets/site-theme.css"><body class="data-view"><h1>Fördjupning · livsvillkor, socialförsäkring och ekonomi</h1><label>Hitta datamängd<input id="search" type="search" placeholder="Sök exempelvis sjukfall, vab, CSN eller förskola"></label><label>Datamängd<select id="dataset"></select></label><p id="scope"></p><p id="status" role="status">Läser lokal katalog…</p><div id="filters"></div><p id="summary"></p><div class="rows"><table><thead><tr><th id="rowTitle">Grupp</th><th>Mätperiod</th><th>Värde</th><th>Enhet</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button id="more" hidden>Visa fler rader</button><a id="download" download>Hämta hela tabellen (JSON)</a><a id="source" target="_blank" rel="noopener">Originalkälla</a></div><details><summary>Definitioner, metod och begränsningar</summary><p id="notes"></p></details><script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=new Intl.NumberFormat('sv-SE',{maximumFractionDigits:2});let catalog=[],cube=null,selected={},rowKey='',cutoff=2026,place={type:'country',id:'00',name:'Sverige'},shown=100,loadToken=0;
function periodEnd(p){const v=String(p).match(/\d{4}/g);if(!v)return -Infinity;let y=Number(v.at(-1));if(v.length===1&&/\/\d{2}$/.test(p))y=Math.floor(y/100)*100+Number(p.slice(-2));return y}
const dim=k=>cube.dimensions.find(d=>d.id===k);
function valueAt(selection){let index=0;for(const d of cube.dimensions){const i=d.index.get(selection[d.id]);if(i===undefined)return null;index=index*d.values.length+i}return cube.values[index]??null}
function setup(){
 selected={};for(const d of cube.dimensions){const total=d.values.find(v=>/^(totalt|samtliga|kvinnor och män|00 riket|riket)/i.test(v[1]));selected[d.id]=(total||d.values[0])[0]}
 if(cube.measure){const d=dim(cube.measure),v=d.values.find(v=>/^Andel$/i.test(v[1]));if(v)selected[d.id]=v[0]}
 rowKey=cube.dimensions.find(d=>![cube.time,cube.measure,cube.region].includes(d.id)&&!/kön/i.test(d.id)&&d.values.length>1)?.id||cube.region||cube.dimensions.find(d=>d.id!==cube.time)?.id;
 applyPlace();controls();render()
}
function applyPlace(){if(!cube?.region)return;const d=dim(cube.region);if(/RegSO/i.test(cube.region)){const prefix=place.type==='municipality'?place.id:place.type==='county'?place.id:null;const matches=prefix?d.values.filter(v=>v[0].startsWith(prefix)):d.values;if(!matches.some(v=>v[0]===selected[cube.region]))selected[cube.region]=(matches[0]||d.values[0])[0];return}const code=cube.regionAliases?.[place.id]||place.id;if(d.values.some(v=>v[0]===code))selected[cube.region]=code;else selected[cube.region]=cube.regionAliases?.['00']||d.values.find(v=>/riket|sverige|^totalt$/i.test(v[1]))?.[0]||d.values[0][0]}
function controls(){
 const options=cube.dimensions.filter(d=>d.id!==cube.time).map(d=>'<option value="'+esc(d.id)+'"'+(d.id===rowKey?' selected':'')+'>'+esc(d.label)+'</option>').join('');let h='<label class="span">Visa som rader<select id="rowDimension">'+options+'</select></label>';
 for(const d of cube.dimensions){if(d.id===cube.time||d.id===rowKey)continue;h+='<label>'+esc(d.label)+'<select data-dim="'+esc(d.id)+'">'+d.values.map(v=>'<option value="'+esc(v[0])+'"'+(selected[d.id]===v[0]?' selected':'')+'>'+esc(v[1])+'</option>').join('')+'</select></label>'}
 h+='<label>Visa mätningar till och med<select id="cutoff">'+Array.from({length:2026-1990+1},(_,i)=>1990+i).map(y=>'<option'+(y===cutoff?' selected':'')+'>'+y+'</option>').join('')+'</select></label>';$('filters').innerHTML=h;
 $('rowDimension').onchange=()=>{rowKey=$('rowDimension').value;shown=100;controls();render()};$('cutoff').onchange=()=>{cutoff=Number($('cutoff').value);shown=100;render()};$('filters').querySelectorAll('[data-dim]').forEach(el=>el.onchange=()=>{selected[el.dataset.dim]=el.value;shown=100;render()})
}
function render(){
 const td=dim(cube.time),rd=dim(rowKey),periods=td.values.filter(v=>periodEnd(cube.timeMode==='validFrom'?v[0]:v[1])<=cutoff),rows=[];
 for(const group of rd.values)for(const period of periods){const selection={...selected,[rowKey]:group[0],[cube.time]:period[0]},value=valueAt(selection),unit=cube.units?.[selection[cube.measure]]?.base||cube.defaultUnit||'';rows.push({group:group[1],period:period[1],value,unit})}
 const available=rows.filter(r=>Number.isFinite(r.value));$('rowTitle').textContent=rd.label;$('rows').innerHTML=rows.slice(0,shown).map(r=>'<tr><td>'+esc(r.group)+'</td><td>'+esc(r.period)+'</td><td>'+(r.value==null?'Uppgift saknas':fmt.format(r.value))+'</td><td>'+esc(r.unit)+'</td></tr>').join('');$('more').hidden=rows.length<=shown;$('more').textContent='Visa fler rader ('+shown+' av '+rows.length+')';
 const region=cube.region?dim(cube.region).values.find(v=>v[0]===selected[cube.region]):null;$('scope').textContent=cube.timeMode==='validFrom'?'Vägledande taxeringshyra per värdeområde och byggnadens värdeår. Värdeområdesnummer är inte kommun- eller RegSO-koder. Utgåvan visas från sitt första giltiga år.':/RegSO/i.test(cube.region||'')?'Valt RegSO: '+(region?.[1]||'se raderna')+'. Detta är ett delområde, inte ett kommunvärde. Välj område i listan. Områdesgränsernas version måste kontrolleras innan jämförelse med kartan.':cube.region?'Geografiskt urval: '+(region?.[1]||'se raderna')+'. '+(rowKey===cube.region?'Alla redovisade områden visas som rader.':place.type!=='country'&&!String(region?.[1]||'').includes(place.name)?'Kontrollera nivån: detta är inte automatiskt ett värde för '+place.name+'.':''):'Nationellt underlag. Grupper efter ålder, ekonomi, bakgrund eller områdestyp är inte kommunvärden.';
 $('status').textContent=periods.length?available.length+' tillgängliga värden i '+rows.length+' redovisade kombinationer. Inga undertryckta värden fylls med noll.':'Inga mätperioder är avslutade före eller under valt år.';
 $('summary').textContent='Tabellen visar källans redovisade grupper och mätperioder. Gruppskillnader visar inte i sig orsaker eller hur det ser ut för en viss person. Olika underlag, mått och tidsperioder ska hållas isär.';
 $('notes').textContent=(cube.notes||[]).join('\n\n')+'\n\nKälla: '+cube.source+' · '+cube.license+' · lokalt uttag '+cube.retrieved+'.';
}
async function load(id){const n=++loadToken,item=catalog.find(c=>c.id===id);if(!item)return;$('dataset').value=id;$('source').href=item.url;cube=null;$('more').hidden=true;$('status').textContent='Läser lokalt hostad tabell…';$('filters').innerHTML='';$('rows').innerHTML='';$('summary').textContent='';if(item.status!=='available'){$('status').textContent=item.reason;$('scope').textContent='Källtabellen kunde inte hämtas. Detta är inte ett nollvärde.';$('download').hidden=true;$('notes').textContent='Katalogposten finns. Värden måste kunna verifieras hos källan innan de visas.';return}
 try{const r=await fetch('/data/deepdives/'+encodeURIComponent(item.file));if(!r.ok)throw Error('Kunde inte läsa den lokala tabellen');let d;if(item.file.endsWith('.gz')){if(typeof DecompressionStream==='undefined')throw Error('Den här webbläsaren kan inte öppna den komprimerade tabellen. Hämta filen via länken eller använd en nyare webbläsare.');d=await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).json()}else d=await r.json();if(n!==loadToken)return;cube=d;for(const dimension of cube.dimensions)dimension.index=new Map(dimension.values.map((v,i)=>[v[0],i]));$('download').hidden=false;$('download').href='/data/deepdives/'+encodeURIComponent(item.file);$('download').textContent=item.file.endsWith('.gz')?'Hämta hela tabellen (JSON, gzip)':'Hämta hela tabellen (JSON)';shown=100;setup()}catch(e){$('status').textContent=e.message}}
function list(){const query=$('search').value.toLocaleLowerCase('sv'),previous=$('dataset').value,items=catalog.filter(c=>(c.label+' '+c.source+' '+c.id).toLocaleLowerCase('sv').includes(query));$('dataset').innerHTML=items.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.label)+' · '+esc(c.source)+(c.status==='available'?'':' · källvärden saknas')+'</option>').join('');if(items.some(c=>c.id===previous))$('dataset').value=previous;else if(items.length)load(items[0].id);else {cube=null;$('rows').innerHTML='';$('filters').innerHTML='';$('status').textContent='Ingen datamängd matchar sökningen.'}}
$('search').oninput=list;$('dataset').onchange=()=>load($('dataset').value);$('more').onclick=()=>{shown+=100;render()};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.kind!=='statistics-context')return;cutoff=Number(e.data.year)||2026;place=e.data.place||place;if(cube){applyPlace();controls();render()}});
fetch('/data/deepdives/catalog.json').then(r=>{if(!r.ok)throw Error('Katalogen kunde inte läsas');return r.json()}).then(async d=>{catalog=d;list();parent.postMessage({kind:'statistics-ready'},location.origin)}).catch(e=>$('status').textContent=e.message);
</script></html>
